name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build APK using Docker
      run: |
        docker run --rm \
          -v $PWD:/app \
          -w /app \
          kivy/buildozer \
          bash -c "yes | buildozer android debug 2>&1"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LBank-Scanner-APK
        path: bin/*.apk
